services:
  - type: web
    name: dissonance
    env: static
    # Builds the launcher and diorama layers, then stitches them into one site:
    # home at /, the living world at /world/, the museum at /museum/, and the
    # preserved DTA exhibit at /museum/dont-turn-around/.
    buildCommand: >-
      pnpm turbo build --filter=home --filter=world --filter=museum --filter=dont-turn-around &&
      rm -rf dist &&
      mkdir -p dist/world &&
      mkdir -p dist/museum/dont-turn-around &&
      cp -r apps/home/dist/. dist/ &&
      cp -r apps/world/dist/. dist/world/ &&
      cp -r apps/museum/dist/. dist/museum/ &&
      cp -r apps/museum/dont-turn-around/dist/. dist/museum/dont-turn-around/
    staticPublishPath: ./dist
    branch: main
    autoDeploy: true
    routes:
      # Order matters: more specific routes must come before the catch-all below.
      - type: rewrite
        source: /museum/dont-turn-around/*
        destination: /museum/dont-turn-around/index.html
      - type: rewrite
        source: /museum/*
        destination: /museum/index.html
      - type: rewrite
        source: /world/*
        destination: /world/index.html
      - type: rewrite
        source: /*
        destination: /index.html
